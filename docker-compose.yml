services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thaiaiagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaiaiagent
      POSTGRES_PASSWORD: thaiaiagent
      POSTGRES_DB: thaiaiagent
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: thaiaiagent-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: thaiaiagent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: thaiaiagent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thaiaiagent
      MINIO_ROOT_PASSWORD: thaiaiagent-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer
    container_name: thaiaiagent-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  migrate:
    image: pgvector/pgvector:pg16
    container_name: thaiaiagent-migrate
    restart: "no"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable}
    volumes:
      - ./go-core/migrations:/migrations:ro
    command: >
      sh -c 'DB_URL="$${POSTGRES_URL%%\?*}"; for f in /migrations/*.sql; do echo "applying $$f"; psql "$$DB_URL" -v ON_ERROR_STOP=1 -f "$$f"; done'
    depends_on:
      - postgres

  core:
    profiles: ["legacy-node"]
    build:
      context: ./go-core
      dockerfile: Dockerfile
    container_name: thaiaiagent-core
    restart: unless-stopped
    environment:
      CORE_LISTEN_ADDR: ":8080"
      NATS_URL: "nats://nats:4222"
    ports:
      - "8090:8080"
    depends_on:
      - nats

  go-api:
    build:
      context: ./go-core
      dockerfile: Dockerfile.api
    container_name: thaiaiagent-go-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3001"
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-dummy-line-token}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-dummy-line-secret}
      LIFF_ID: ${LIFF_ID:-}
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID:-}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable}
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:example@mongodb:27017/thaiaiagent?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-thaiaiagent}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-thaiaiagent-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-thaiaiagent}
      IMAGE_ACCESS_SECRET: ${IMAGE_ACCESS_SECRET:-thaiaiagent-dev-image-secret}
      THCLAWS_GATEWAY_URL: ${THCLAWS_GATEWAY_URL:-https://smlgateway.smlsoftdemo.com/v1}
      THCLAWS_API_KEY: ${THCLAWS_API_KEY:-dummy}
      LINE_REPLY_TIMEOUT_MS: ${LINE_REPLY_TIMEOUT_MS:-35000}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started

  go-worker:
    build:
      context: ./go-core
      dockerfile: Dockerfile.worker
    container_name: thaiaiagent-go-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-dummy-line-token}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-dummy-line-secret}
      LIFF_ID: ${LIFF_ID:-}
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID:-}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable}
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:example@mongodb:27017/thaiaiagent?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-thaiaiagent}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-thaiaiagent-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-thaiaiagent}
      IMAGE_ACCESS_SECRET: ${IMAGE_ACCESS_SECRET:-thaiaiagent-dev-image-secret}
      THCLAWS_GATEWAY_URL: ${THCLAWS_GATEWAY_URL:-https://smlgateway.smlsoftdemo.com/v1}
      THCLAWS_API_KEY: ${THCLAWS_API_KEY:-dummy}
      LINE_REPLY_TIMEOUT_MS: ${LINE_REPLY_TIMEOUT_MS:-35000}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started

  go-outbox:
    build:
      context: ./go-core
      dockerfile: Dockerfile.outbox
    container_name: thaiaiagent-go-outbox
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-dummy-line-token}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-dummy-line-secret}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable}
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:example@mongodb:27017/thaiaiagent?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-thaiaiagent}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-thaiaiagent-dev-secret}
      THCLAWS_GATEWAY_URL: ${THCLAWS_GATEWAY_URL:-https://smlgateway.smlsoftdemo.com/v1}
      THCLAWS_API_KEY: ${THCLAWS_API_KEY:-dummy}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  nats:
    image: nats:2.10-alpine
    container_name: thaiaiagent-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

volumes:
  pg_data:
  mongo_data:
  redis_data:
  minio_data:
  nats_data:
