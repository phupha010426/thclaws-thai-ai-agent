services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thaiaiagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaiaiagent
      POSTGRES_PASSWORD: thaiaiagent
      POSTGRES_DB: thaiaiagent
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaiaiagent -d thaiaiagent"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: thaiaiagent-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thaiaiagent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: thaiaiagent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thaiaiagent
      MINIO_ROOT_PASSWORD: thaiaiagent-dev-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: thaiaiagent-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGUSER: thaiaiagent
      PGPASSWORD: thaiaiagent
      PGHOST: postgres
      PGDATABASE: thaiaiagent
    volumes:
      - ./go-core/migrations:/migrations:ro
    command: >
      sh -c 'for f in /migrations/*.sql; do echo "applying $$f"; psql -v ON_ERROR_STOP=1 -f "$$f"; done'
    depends_on:
      postgres:
        condition: service_healthy

  go-api:
    build:
      context: ./go-core
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "3002"
      LINE_CHANNEL_ACCESS_TOKEN: dummy-line-token
      LINE_CHANNEL_SECRET: dummy-line-secret
      POSTGRES_URL: postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable
      MONGODB_URL: mongodb://root:example@mongodb:27017/thaiaiagent?authSource=admin
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:3002
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: thaiaiagent
      MINIO_SECRET_KEY: thaiaiagent-dev-secret
      MINIO_BUCKET: thaiaiagent
      IMAGE_ACCESS_SECRET: change-me
      SML_GATEWAY_BASE_URL: http://100.97.144.99:3334/v1
      SML_GATEWAY_API_KEY: dummy
      DEFAULT_AGENT_MODEL: sml/fast
      SMLGATEWAY_PREFER_PROVIDERS: typhoon,thaillm,groq,cerebras
      NATS_URL: nats://nats:4222
    ports:
      - "3002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  go-worker:
    build:
      context: ./go-core
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      LINE_CHANNEL_ACCESS_TOKEN: dummy-line-token
      LINE_CHANNEL_SECRET: dummy-line-secret
      POSTGRES_URL: postgres://thaiaiagent:thaiaiagent@postgres:5432/thaiaiagent?sslmode=disable
      MONGODB_URL: mongodb://root:example@mongodb:27017/thaiaiagent?authSource=admin
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: thaiaiagent
      MINIO_SECRET_KEY: thaiaiagent-dev-secret
      MINIO_BUCKET: thaiaiagent
      SML_GATEWAY_BASE_URL: http://100.97.144.99:3334/v1
      SML_GATEWAY_API_KEY: dummy
      DEFAULT_AGENT_MODEL: sml/fast
      NATS_URL: nats://nats:4222
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8090:8080"

volumes:
  pg_data:
  mongo_data:
  redis_data:
  minio_data:
  nats_data:
